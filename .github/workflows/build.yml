name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: osucraft-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
