name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$G" ]; then
            echo "No se encontró gradlew. Estos son los archivos del repo:"
            ls -R | head -50
            exit 1
          fi
          cd "$(dirname "$G")"
          echo "Proyecto en: $(pwd)"
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: osucraft-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
